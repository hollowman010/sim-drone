[tool:pytest]
markers =
    airsim: tests that require a running AirSim instance
    slow: slow tests that take more than 30 seconds
    integration: integration tests that require external services

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
