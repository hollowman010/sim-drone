[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sim-drone"
version = "0.1.0"
description = "Cloud-based AirSim drone simulation + vision"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Your Name" }]
license = { text = "MIT" }

dependencies = [
  "airsim==1.8.1",
  "opencv-python-headless>=4.8.0",
  "numpy>=1.24,<2.0",
  "msgpack-rpc-python",
  "requests",
  "PyYAML",
  "google-auth>=2.17.0",
  "google-cloud-compute>=1.16.1",
  "loguru>=0.7.0"
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "types-PyYAML"]

[project.scripts]
simdrone = "sim_drone.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sim_drone*"]

[tool.ruff]
line-length = 100
target-version = "py310"