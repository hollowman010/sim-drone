[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sim-drone"
version = "0.1.0"
description = "Cloud-based AirSim drone simulation and control"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Medi Monam" }]

# Keep these aligned with requirements.txt
dependencies = [
  "airsim>=1.8.1",
  "numpy>=1.24.0",
  "opencv-python>=4.8.0",
  "msgpack-rpc-python>=0.4.1",
  "requests>=2.31",
  "PyYAML>=6.0",
  "google-auth>=2.17.0",
  "google-cloud-compute>=1.14.0"
]

[project.urls]
Homepage = "https://github.com/hollowman010/sim-drone"

[project.scripts]
simdrone = "sim_drone.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["sim_drone*"]
